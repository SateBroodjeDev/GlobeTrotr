<!DOCTYPE html>
<html lang="nl" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTrotr - Registreren</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
  </style>
</head>
<body data-auth-mode="register" class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-8 space-y-6">
    <div class="space-y-2 text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-300 text-2xl">🌍</div>
      <h1 class="text-2xl font-extrabold">Maak je GlobeTrotr account</h1>
      <p class="text-sm text-slate-400">Registreer en ga direct verder met je eerste workspace en trip.</p>
    </div>
    <form id="auth-form" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Naam</label>
        <input name="name" type="text" class="w-full rounded-2xl bg-slate-950 border border-slate-700 px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-500" placeholder="Jouw naam">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">E-mailadres</label>
        <input name="email" type="email" class="w-full rounded-2xl bg-slate-950 border border-slate-700 px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-500" placeholder="naam@voorbeeld.nl">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Wachtwoord</label>
        <input name="password" type="password" class="w-full rounded-2xl bg-slate-950 border border-slate-700 px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-500" placeholder="Minimaal 8 tekens">
      </div>
      <p id="auth-error" class="hidden text-sm text-rose-400 font-semibold"></p>
      <button id="auth-submit" type="submit" class="w-full rounded-2xl bg-indigo-600 hover:bg-indigo-500 px-4 py-3 font-bold text-white transition">Registreren</button>
    </form>
    <p class="text-sm text-center text-slate-400">Heb je al een account? <a href="./index.html" class="text-sky-400 hover:text-sky-300 font-semibold">Log hier in</a></p>
  </div>
  <script type="module" src="./src/auth-page.js"></script>
</body>
</html>
